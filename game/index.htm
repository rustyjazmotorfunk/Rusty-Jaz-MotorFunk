<script type="text/javascript">

// Function to detect standalone
function isRunningStandalone() {
    return (window.matchMedia('(display-mode: standalone)').matches);
}

//Set canvas to fullscreen
if (isRunningStandalone()) {
    var ch = window.innerHeight-70;
} else {
    var ch = window.innerHeight-60;
}
var cw = window.innerWidth;
if(cw > ch) {
  gameCanvas.height = ch;
  gameCanvas.width = ch+60;
  title.width = ch+60;
} else {
  gameCanvas.height = ch;
  gameCanvas.width = cw;
  title.width=cw;
}

// Canvas vars
var canvas;
var canvasContext;
// Ball vars
var ballX = 50;
var ballY = 50;
var ballSpeedX = 3;
var ballSpeedY = 8;
var ballSpeedPlus = 0;
var ballRad = 25;
var ballColor = "white";
// Paddles vars
var paddle1X = 250;
var paddle2X = 250;
var paddle_width = 100;

if(gameCanvas.width < 400) {
    paddle_width = ((gameCanvas.width)/4);
}
const paddle_thick = 10;
// Score vars
var player1Score = 0;
var player2Score = 0;
var player1Level = 0;
var player2Level = 0;
const winningScore = 10;
var showWinner = true;
// Colors vars
var leftPlayerColor = "blue";
var rightPlayerColor = "red";
var bgColor = "black";
var textColor = "white";
// Font Style var
var fontStyle = "30px Bangers";
// Net Color var
var netColor = "white";
// Selecting the image as the Ball
var img = document.getElementById("rjmf");
// Setting for mute
playBack = true;

// Getting mouse position
function mousePos(e) {
  var rec = canvas.getBoundingClientRect();
  var root = document.documentElement;
  var mouseX = e.clientX - root.scrollLeft - rec.left;
  var mouseY = e.clientY - root.scrollTop - rec.top;
  return {
    x: mouseX,
    y: mouseY
  };
}

// Enemy ( Bottom player ) movement
function enemyMove() {
  var paddle2Center = paddle2X + (paddle_width/2);
  if(paddle2Center < ballX - 35) {
    paddle2X += (10 + ballSpeedPlus);
  } else if(paddle2Center > ballX + 35) {
    paddle2X -= (10 + ballSpeedPlus);
  }
}

// Launching the game when window is loaded
window.onload = function() {
  canvas = document.getElementById("gameCanvas");
  canvasContext = canvas.getContext("2d");
  
  var framesPerSec = 30;
  setInterval(function() {
    moveEverything();
    drawEverything();
  }, 1000/framesPerSec);
  
  canvas.addEventListener("mousedown", restartGame);
  
  canvas.addEventListener("mousemove", function(e){
    var calMousePos = mousePos(e);
    paddle1X = calMousePos.x-(paddle_width/2);
  });

  canvas.addEventListener("touchmove", function (e) {
    var touch = e.touches[0];
    var mouseEvent = new MouseEvent("mousemove", {
      clientX: touch.clientX,
      clientY: touch.clientY
    });
    canvas.dispatchEvent(mouseEvent);
  }, false);
  
  canvas.addEventListener("touchstart", function(e) { 
    var mouseEvent = new MouseEvent("mousedown", {});
    canvas.dispatchEvent(mouseEvent);
  });
  
  window.addEventListener("blur", PauseOnly);
  window.addEventListener("focus", PlayOnly);
}

// Restarting the game function
function restartGame() {
  if(showWinner) {
    player1Score = 0;
    player2Score = 0;
    showWinner = false;
    if(playBack) { ChangeSong(); }
  }
}

// Moving everything in canvas function
function moveEverything() {
  if(showWinner) {
    return;
  }
  enemyMove();
  ballX += ballSpeedX;
  ballY += ballSpeedY;
  
  if(ballY > canvas.height - (paddle_thick + ballRad)){
    if(ballX > paddle2X && ballX < paddle2X + paddle_width) {
      ballSpeedY = -ballSpeedY;
      var deltaX = ballX - (paddle2X+paddle_width/2);
      ballSpeedX = deltaX * .35;
     } else {
       player1Score++;
       ballReset();        
     }
  }
  
  if(ballY < (paddle_thick + ballRad)){
    if(ballX > paddle1X && ballX < paddle1X + paddle_width) {
      ballSpeedY = -ballSpeedY;
      var deltaX = ballX - (paddle1X+paddle_width/2);
      ballSpeedX = deltaX * .35;
     } else {
       player2Score++;
       ballReset();        
     }
  }
  
  if(ballX > canvas.width){
    ballSpeedX = -ballSpeedX;
  }
  if(ballX < 0){
    ballSpeedX = -ballSpeedX;
  }
}

function ballReset() {
  if(player1Score >= winningScore || player2Score >= winningScore) {
    showWinner = true;
    ballSpeedPlus += 1;
    ballSpeedX = ballSpeedX*1.2;
    ballSpeedY = ballSpeedY*1.2;
  }
  ballSpeedY = -ballSpeedY;
  ballX = canvas.width/2;
  ballY = canvas.height/2;
}

// Draw everything in the canvas function
function drawEverything() { 
  colorRect(0,0,canvas.width,canvas.height,bgColor);
  
  if(showWinner) {
    if(player1Score>= winningScore) {
      if (player1Level+player2Level<ballSpeedPlus) {player1Level++;}
      canvasContext.fillStyle = leftPlayerColor;
      var text = "Vous avez gagné / You Win !";
    } else if(player2Score>= winningScore) {
      if (player1Level+player2Level<ballSpeedPlus) {player2Level++;}
      canvasContext.fillStyle = rightPlayerColor;
      var text = "RJMF a gagné / RJMF Win !";
    } else {
      canvasContext.fillStyle = leftPlayerColor;
      var text = "Bienvenue ! / Welcome!";
    }
    
    canvasContext.font = "25px Bangers";
    var x = (canvasContext.measureText(text).width);
    canvasContext.fillText(text,(canvas.width-x)/2, (canvas.height)/3);
    canvasContext.fillStyle = textColor;
    var text2 = "Cliquez pour continuer";
    var x = (canvasContext.measureText(text2).width);
    canvasContext.fillText(text2,(canvas.width-x)/2, (canvas.height)/3*2);
    var text3 = "Click to continue";
    var x = (canvasContext.measureText(text3).width);
    canvasContext.fillText(text3,(canvas.width-x)/2, (canvas.height)*0.75);
    
    if (ballSpeedPlus>0) {
        var text4 = "Level "+(ballSpeedPlus+1);
        canvasContext.fillStyle = "#CCCCCC";
        var x = (canvasContext.measureText(text4).width);
        canvasContext.fillText(text4,(canvas.width-x)/2,(canvas.height)/2);
        canvasContext.fillStyle = leftPlayerColor;
        canvasContext.fillText(player1Level,(canvas.width-x)/2-50,(canvas.height)/2);
        canvasContext.fillStyle = rightPlayerColor;
        canvasContext.fillText(player2Level,(canvas.width-x)/2+x+40,(canvas.height)/2);
    }
    return;
  }
  
  colorRect(paddle1X,0,paddle_width,paddle_thick,leftPlayerColor);
  colorRect(paddle2X,canvas.height-paddle_thick,paddle_width,paddle_thick,rightPlayerColor);
  colorCircle(ballX, ballY,ballRad,ballColor);
  
  canvasContext.font = fontStyle;
  canvasContext.fillStyle = leftPlayerColor;
  canvasContext.fillText(player1Score, 100, 100);
  canvasContext.fillStyle = rightPlayerColor;
  canvasContext.fillText(player2Score, canvas.width-100, canvas.height-100);
}

function colorCircle(centeX, centerY, radius, color) {
  canvasContext.drawImage(img, centeX-20, centerY-28, 42, 50);
}

function colorRect(leftX, topY, width, height, color) {
  canvasContext.fillStyle = color;
  canvasContext.fillRect(leftX, topY, width, height);
}

// Load songs from Audius
var fetchError = 'false';
var audiusHost = 'https://discoveryprovider.audius.co';
var track = 'VK909';
var audiusSrc = '';
var tr = '';

async function getMusic() {
    const sample = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const host = await fetch('https://api.audius.co')
    .then(r => r.json())
    .then(j => j.data)
    .then(d => sample(d));
    audiusHost = host;
    
    await fetch(audiusHost+'/v1/users/aAZNj/tracks?app_name=RJMF')  
    .then(function(response) { 
        if(response.ok){
            tr = response.json().data;
        }
        throw new Error('Something went wrong.');
    })  
    .catch(function(error) { 
        fetchError = "true";
        audiusHost = 'https://discoveryprovider.audius.co';
    });
    
    const sample2 = (arr) => arr[Math.floor(Math.random() * arr.length)];
    tr = await fetch(audiusHost+'/v1/users/aAZNj/tracks?app_name=RJMF')
    .then(r => r.json())
    .then(j => j.data);
    
    track = sample2(tr).id;
    
    const audiusSrcF = await fetch(audiusHost+'/v1/tracks/'+track+'/stream?app_name=RJMF')
    .then(r => r.url);
    audiusSrc = audiusSrcF;
    
    src.src = audiusSrc;
    src.id = audiusSrc;
    soundFile.appendChild(src);
}
getMusic();

soundFile = document.createElement("audio");
soundFile.preload = "auto";

src = document.createElement("source");
src.src = audiusSrc;
src.id = "audiusSrc";
soundFile.appendChild(src);
soundFile.load();

function play() {
    soundFile.currentTime = 0.01;
    soundFile.volume = volume;
    setTimeout(function(){soundFile.play();},1);
}

btn = document.getElementById("btnPause");

function PausePlay() {
    if (soundFile.paused) {
        soundFile.play();
        btn.src = "music_off.png";
        playBack = true;
    } else if (soundFile.ended) {
        soundFile.currentTime = 0;
        soundFile.play();
        btn.src = "music_off.png";
        playBack = true;
    } else {
        soundFile.pause();
        btn.src = "music_on.png";
        playBack = false;
    }
}

function PlayOnly() {
    if (soundFile.paused && playBack) {
        soundFile.play();
        btn.src = "music_off.png";
    } else if (soundFile.ended && playBack) {
        soundFile.currentTime = 0;
        soundFile.play();
        btn.src = "music_off.png";
    }
}

function PauseOnly() {
    soundFile.pause();
    btn.src = "music_on.png";
}

async function ChangeSong() {
    const sample2 = (arr) => arr[Math.floor(Math.random() * arr.length)];
    track = sample2(tr).id;
    await fetch(audiusHost+'/v1/tracks/'+track+'/stream?app_name=RJMF')  
    .then(function(response) { 
        if(response.ok){
            audiusSrc = response.url;
            src.src = audiusSrc;
            src.id = audiusSrc;
            soundFile.appendChild(src);
            soundFile.pause();
            soundFile.load();
        }
    });
    soundFile.play();
    btn.src = "music_off.png";
}

</script>
